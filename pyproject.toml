[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepview"
version = "0.2.0.dev0"
description = "A study of surface mesh estimation from 3D volumetric ultrasound in industrial NDT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Donald Nguyen" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "trimesh>=4.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "nbstripout>=0.7.1",
    "types-PyYAML>=6.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "pyvista>=0.43.0",
]

[project.scripts]
deepview-eval = "deepview.evaluation.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepview"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["deepview"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "trimesh.*",
    "pyvista.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "known_answer: analytical tests for metric exactness",
    "smoke: quick CPU end-to-end integration tests",
]
